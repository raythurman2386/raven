# cargo-mutants configuration
# Focus mutation testing on logic-heavy modules; exclude UI glue.
# Prefer: `cargo mutants --config mutants.toml`
# (cargo-mutants' default path is `.cargo/mutants.toml`.)

# Main entry + TUI — argument parsing / UI glue, not mutation targets
exclude_globs = [
    "src/main.rs",
    "src/tui/**/*.rs",
]
