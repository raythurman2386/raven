name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          # Windows and macOS builds are intentionally omitted to save action
          # minutes. Raven targets Linux and Raspberry Pi (aarch64).

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97"

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@7bfb4d96970755941ebb30b301a178916e404934 # cross

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare binary
        id: artifact
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BIN_NAME="raven-${VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/raven" "${BIN_NAME}"
          echo "bin_name=${BIN_NAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.bin_name }}
          path: ${{ steps.artifact.outputs.bin_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Package release
        # Compute SHA-256 over every built binary (integrity), build per-binary
        # .tar.gz/.zip archives, and append archive checksums. The maintainer
        # signs checksums.txt offline with scripts/sign-release.sh and uploads
        # checksums.txt.sig (authenticity) — the secret key never enters CI.
        working-directory: artifacts
        shell: bash
        run: |
          bash ../scripts/package-release.sh .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: artifacts/*
          generate_release_notes: true
