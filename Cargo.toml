[workspace]
resolver = "2"
members = [".", "crates/raven-proto", "crates/raven-tokenizer", "crates/raven-config", "crates/raven-persist", "crates/raven-sandbox", "crates/raven-tools", "crates/raven-agent"]

[workspace.package]
version = "0.6.9"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
tokio = { version = "1.36", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1"
thiserror = "2"
dirs = "7"
walkdir = "2"
regex = "1.10"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
unicode-segmentation = "1.13"
pulldown-cmark = "0.13.4"
anydoc = "0.2.4"
tempfile = "3"
rustix = { version = "1.1.4", features = ["fs", "process"] }
shlex = "2.0.1"
libc = "0.2"
ignore = "0.4"
ring = "0.17"
base64 = "0.23"
landlock = "0.4.7"
seccompiler = "0.5.0"
criterion = "0.8"
zip = "8.6"
raven-proto = { path = "crates/raven-proto", version = "0.6.9" }
raven-tokenizer = { path = "crates/raven-tokenizer", version = "0.6.9" }
raven-config = { path = "crates/raven-config", version = "0.6.9" }
raven-persist = { path = "crates/raven-persist", version = "0.6.9" }
raven-sandbox = { path = "crates/raven-sandbox", version = "0.6.9" }
raven-tools = { path = "crates/raven-tools", version = "0.6.9" }
raven-agent = { path = "crates/raven-agent", version = "0.6.9" }

[package]
name = "raven"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "An opinionated, personal coding-agent harness for Linux and Raspberry Pi (Ollama / OpenAI-compatible endpoints)"

[[bin]]
name = "raven"
path = "src/main.rs"

[dependencies]
raven-proto = { workspace = true }
raven-tokenizer = { workspace = true }
raven-config = { workspace = true }
raven-persist = { workspace = true }
raven-sandbox = { workspace = true }
raven-tools = { workspace = true }
raven-agent = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
pulldown-cmark = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "context"
harness = false

[[bench]]
name = "repomap"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
