[package]
name = "raven"
version = "0.5.10"
edition = "2021"
description = "Privacy-first local coding-agent harness for Ollama / OpenAI-compatible endpoints"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "raven"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive", "env"] }
tokio = { version = "1.36", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1"
thiserror = "2"
dirs = "6"
walkdir = "2"
regex = "1.10"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
unicode-segmentation = "1.13"
pulldown-cmark = "0.13.4"
anydoc = "0.1.6"
tempfile = "3"
rustix = { version = "1.1.4", features = ["fs", "process"] }
shlex = "2.0.1"
libc = "0.2"
ignore = "0.4"
ring = "0.17"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = "0.8"
zip = "8.6"

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "context"
harness = false

[[bench]]
name = "repomap"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
