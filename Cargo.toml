[package]
name = "raven"
version = "0.1.0"
edition = "2021"
description = "Privacy-first local coding-agent harness for Ollama / OpenAI-compatible endpoints"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "raven"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive", "env"] }
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1"
thiserror = "1"
dirs = "5"
walkdir = "2"
regex = "1.10"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.27"
ratatui = "0.26"
anydoc = "0.1.6"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
zip = "8.6"

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "context"
harness = false

[[bench]]
name = "repomap"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
