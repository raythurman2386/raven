[workspace]
resolver = "2"
members = [".", "crates/huginn-proto", "crates/huginn-tokenizer", "crates/huginn-config", "crates/huginn-persist", "crates/huginn-sandbox", "crates/huginn-tools", "crates/huginn-agent", "crates/huginn-tui", "crates/huginn-acp", "crates/huginn-testutil"]
default-members = [".", "crates/huginn-proto", "crates/huginn-tokenizer", "crates/huginn-config", "crates/huginn-persist", "crates/huginn-sandbox", "crates/huginn-tools", "crates/huginn-agent", "crates/huginn-tui", "crates/huginn-acp", "crates/huginn-testutil"]

[workspace.package]
version = "0.6.11"
edition = "2021"
license = "MIT"
rust-version = "1.88"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
tokio = { version = "1.36", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1"
thiserror = "2"
dirs = "7"
walkdir = "2"
regex = "1.10"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
unicode-segmentation = "1.13"
pulldown-cmark = "0.13.6"
anydoc = "0.2.4"
tempfile = "3"
rustix = { version = "1.1.4", features = ["fs", "process"] }
shlex = "2.0.1"
libc = "0.2"
ignore = "0.4"
ring = "0.17"
base64 = "0.23"
landlock = "0.4.7"
seccompiler = "0.5.0"
criterion = "0.8"
zip = "9.5"
huginn-proto = { path = "crates/huginn-proto", version = "0.6.11" }
huginn-tokenizer = { path = "crates/huginn-tokenizer", version = "0.6.11" }
huginn-config = { path = "crates/huginn-config", version = "0.6.11" }
huginn-persist = { path = "crates/huginn-persist", version = "0.6.11" }
huginn-sandbox = { path = "crates/huginn-sandbox", version = "0.6.11" }
huginn-tools = { path = "crates/huginn-tools", version = "0.6.11" }
huginn-agent = { path = "crates/huginn-agent", version = "0.6.11" }
huginn-tui = { path = "crates/huginn-tui", version = "0.6.11" }
huginn-acp = { path = "crates/huginn-acp", version = "0.6.11" }
huginn-testutil = { path = "crates/huginn-testutil", version = "0.6.11" }

[package]
name = "huginn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "An opinionated, personal coding-agent harness for Linux and Raspberry Pi (Ollama / OpenAI-compatible endpoints)"

[[bin]]
name = "huginn"
path = "src/main.rs"

[dependencies]
huginn-proto = { workspace = true }
huginn-tokenizer = { workspace = true }
huginn-config = { workspace = true }
huginn-persist = { workspace = true }
huginn-sandbox = { workspace = true }
huginn-tools = { workspace = true }
huginn-agent = { workspace = true }
huginn-tui = { workspace = true }
huginn-acp = { workspace = true }
huginn-testutil = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
libc = { workspace = true }

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "context"
harness = false

[[bench]]
name = "repomap"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

# anydoc 0.2.4 on crates.io pins zip 8.6.0. See third_party/anydoc/PATCH.md.
[patch.crates-io]
anydoc = { path = "third_party/anydoc" }
